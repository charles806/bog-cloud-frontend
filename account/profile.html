<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOG Cloud - Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script>
// Apply theme ASAP to prevent white flash
(function(){
  const saved = localStorage.getItem('bog-theme');
  if(saved === 'dark') document.documentElement.classList.add('dark');
})();
</script>
<style>
  :root{
    --google-blue: #1A73E8;
    --google-blue-hover: #1765CC;
    --white: #FFFFFF;
    --gray-900: #202124;
    --gray-700: #5F6368;
    --gray-100: #F1F3F4;
    --border: #DADCE0;
    --red: #D93025;
    --sidebar-bg: #FFFFFF;
    --card-bg: #FFFFFF;
    --hover-bg: #F1F3F4;
  }
  :root.dark{
    --white: #1F1F1F;
    --gray-900: #E8EAED;
    --gray-700: #9AA0A6;
    --gray-100: #202124;
    --border: #5F6368;
    --sidebar-bg: #292A2D;
    --card-bg: #292A2D;
    --hover-bg: #3C4043;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Roboto', Arial, sans-serif;}
  body{background:var(--gray-100);color:var(--gray-900);transition:background 0.3s,color 0.3s;}

/* TOPBAR MATCHES DASHBOARD */
.topbar{height:64px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:16px;}
.hamburger{background:none;border:none;font-size:24px;cursor:pointer;color:var(--gray-700);padding:8px;display:none;}
.logo{display:flex;align-items:center;text-decoration:none;}
.logo-img{width:80px;height:80px;object-fit:cover;object-position:center;background:transparent;flex-shrink:0;} /* LOGO ZOOM */
.topbar-right{display:flex;align-items:center;gap:12px;}
.icon-btn{background:none;border:none;font-size:14px;font-weight:500;cursor:pointer;color:var(--gray-700);padding:8px 12px;border-radius:8px;border:1px solid var(--border);}
.icon-btn:hover{background:var(--hover-bg);}

.container{max-width:900px;margin:40px auto;padding:0 24px;}
.profile-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 1px 2px rgba(60,64,67,.1);transition:background 0.3s;}
.profile-header{display:flex;align-items:center;gap:24px;margin-bottom:32px;border-bottom:1px solid var(--border);padding-bottom:24px;}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:var(--google-blue);color:var(--white);display:grid;place-items:center;font-weight:500;font-size:36px;flex-shrink:0;}
.profile-info h1{font-size:24px;font-weight:400;margin-bottom:4px;word-break:break-word;}
.profile-info p{font-size:14px;color:var(--gray-700);word-break:break-all;}

.section{margin-bottom:24px;}
.section-title{font-size:16px;font-weight:500;margin-bottom:16px;}
.btn{padding:10px 24px;border:none;border-radius:24px;background:var(--google-blue);color:var(--white);font-size:14px;font-weight:500;cursor:pointer;margin-right:12px;margin-top:8px;transition:all 0.2s;}
.btn:hover{background:var(--google-blue-hover);}
.btn:disabled{opacity:0.6;cursor:not-allowed;}
.btn-outline{background:var(--card-bg);color:var(--google-blue);border:1px solid var(--google-blue);}
.btn-outline:hover{background:#E8F0FE;}
.btn-danger{background:var(--red);}
.btn-danger:hover{background:#B31412;}
.btn-secondary{background:var(--gray-700);}
.btn-secondary:hover{background:#3C4043;}

.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--google-blue);text-decoration:none;margin-bottom:16px;font-size:14px;}
.back-link:hover{text-decoration:underline;}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--gray-100);flex-wrap:wrap;}
.row-label{font-size:14px;color:var(--gray-700);}
.row-value{font-size:14px;font-weight:500;word-break:break-word;}

/* INLINE FORM STYLES */
.inline-form{display:none;margin-top:16px;padding:20px;background:#F8F9FA;border:1px solid var(--border);border-radius:8px;}
:root.dark.inline-form{background:#3C4043;}
.inline-form.open{display:block;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:14px;color:var(--gray-700);margin-bottom:8px;}
.form-group input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--card-bg);color:var(--gray-900);}
.form-group input:focus{border-color:var(--google-blue);box-shadow:0 0 0 2px rgba(26,115,232,0.2);}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;display:none;}
.alert.success{background:#E6F4EA;color:#137333;}
.alert.error{background:#FCE8E6;color:#C5221F;}

/* MOBILE RESPONSIVE */
@media(max-width:768px){
.container{margin:20px auto;padding:0 16px;}
.topbar{padding:0 12px;}
.logo-img{width:64px;height:64px;} /* MOBILE LOGO ZOOM */
.profile-card{padding:20px;}
.profile-header{flex-direction:column;text-align:center;gap:16px;}
.profile-avatar{width:72px;height:72px;font-size:32px;}
.profile-info h1{font-size:20px;}
.row{flex-direction:column;align-items:flex-start;}
.btn{width:100%;margin-right:0;}
}
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a href="/dashboard/dashboard.html" class="logo">
        <img src=" /images/logo.jpeg" alt="BOG Cloud Logo" class="logo-img" onerror="this.style.display='none';">
      </a>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="themeToggle" title="Toggle Theme">Dark</button>
    </div>
  </div>

  <div class="container">
    <a href="/dashboard/dashboard.html" class="back-link">← Back to Drive</a>

    <div class="profile-card">
      <div id="alertBox" class="alert"></div>

      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">B</div>
        <div class="profile-info">
          <h1 id="profileName">Loading...</h1>
          <p id="profileEmail">loading@email.com</p>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Personal Info</div>
        <div class="row">
          <div>
            <div class="row-label">Display Name</div>
            <div class="row-value" id="displayName">User</div>
          </div>
          <button class="btn btn-outline" onclick="toggleNameForm()">Edit</button>
        </div>
        <div class="inline-form" id="nameForm">
          <div class="form-group">
            <label>New Display Name</label>
            <input type="text" id="newNameInput" placeholder="Enter your name">
          </div>
          <button class="btn" id="saveNameBtn" onclick="saveName()">Save Name</button>
          <button class="btn btn-secondary" onclick="toggleNameForm()">Cancel</button>
        </div>

        <div class="row">
          <div>
            <div class="row-label">Email</div>
            <div class="row-value" id="displayEmail">user@email.com</div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Security</div>
        <button class="btn btn-outline" onclick="togglePasswordForm()">Change Password</button>

        <div class="inline-form" id="passwordForm">
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="currentPassword" placeholder="Enter your current password">
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password, min 6 characters">
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password">
          </div>
          <button class="btn" id="updatePassBtn" onclick="savePassword()">Update Password</button>
          <button class="btn btn-secondary" onclick="togglePasswordForm()">Cancel</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Account</div>
        <button class="btn btn-danger" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updatePassword, updateProfile, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7Ve_lk5waFwPNcQwHxM9DpYFkeEsQa74",
  authDomain: "bog-cloud.firebaseapp.com",
  projectId: "bog-cloud",
  storageBucket: "bog-cloud.appspot.com",
  messagingSenderId: "219071508992",
  appId: "1:219071508992:web:42516a44ed5d2f6a59dee5"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let currentUser = null;

// DARK MODE
function updateThemeButton(){
  const isDark = document.documentElement.classList.contains('dark');
  document.getElementById('themeToggle').textContent = isDark? 'Light' : 'Dark';
}
function toggleTheme(){
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('bog-theme', document.documentElement.classList.contains('dark')? 'dark' : 'light');
  updateThemeButton();
}
document.getElementById('themeToggle').onclick = toggleTheme;
updateThemeButton();

function showAlert(message, type){
  const box = document.getElementById('alertBox');
  box.textContent = message;
  box.className = `alert ${type}`;
  box.style.display = 'block';
  window.scrollTo(0,0);
  setTimeout(() => box.style.display = 'none', 5000);
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    const name = user.displayName || user.email.split('@')[0];
    const initial = name[0].toUpperCase();

    document.getElementById('profileAvatar').textContent = initial;
    document.getElementById('profileName').textContent = name;
    document.getElementById('profileEmail').textContent = user.email;
    document.getElementById('displayName').textContent = name;
    document.getElementById('displayEmail').textContent = user.email;
    document.getElementById('newNameInput').value = name;
  } else {
    window.location.href = '/auth/login.html';
  }
});

window.logout = async () => {
  await signOut(auth);
  window.location.href = '/index.html';
}

window.toggleNameForm = () => {
  document.getElementById('nameForm').classList.toggle('open');
}

window.saveName = async () => {
  const btn = document.getElementById('saveNameBtn');
  const newName = document.getElementById('newNameInput').value.trim();
  if(!newName) { showAlert("Name cannot be empty", "error"); return; }

  btn.disabled = true; btn.textContent = "Saving...";
  try{
    await updateProfile(currentUser, { displayName: newName });
    showAlert("Name updated successfully!", "success");
    toggleNameForm();
    document.getElementById('profileName').textContent = newName;
    document.getElementById('displayName').textContent = newName;
    document.getElementById('profileAvatar').textContent = newName[0].toUpperCase();
  } catch(error){
    showAlert("Error: " + error.message, "error");
  }
  btn.disabled = false; btn.textContent = "Save Name";
}

window.togglePasswordForm = () => {
  document.getElementById('passwordForm').classList.toggle('open');
  document.getElementById('currentPassword').value = '';
  document.getElementById('newPassword').value = '';
  document.getElementById('confirmPassword').value = '';
}

window.savePassword = async () => {
  const btn = document.getElementById('updatePassBtn');
  const currentPass = document.getElementById('currentPassword').value;
  const newPass = document.getElementById('newPassword').value;
  const confirmPass = document.getElementById('confirmPassword').value;

  if(!currentPass){ showAlert("Please enter current password", "error"); return; }
  if(!newPass || newPass.length < 6){
    showAlert("New password must be at least 6 characters", "error");
    return;
  }
  if(newPass!== confirmPass){
    showAlert("New passwords do not match", "error");
    return;
  }

  btn.disabled = true; btn.textContent = "Updating...";
  try{
    const credential = EmailAuthProvider.credential(currentUser.email, currentPass);
    await reauthenticateWithCredential(currentUser, credential);
    await updatePassword(currentUser, newPass);
    showAlert("Password updated successfully!", "success");
    togglePasswordForm();
  } catch(error){
    if(error.code === 'auth/wrong-password'){
      showAlert("Current password is incorrect", "error");
    } else {
      showAlert("Error: " + error.message, "error");
    }
  }
  btn.disabled = false; btn.textContent = "Update Password";
}
</script>
</body>
</html>
