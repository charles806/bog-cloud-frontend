<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOG Cloud - Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="javascript/profile-1.js"></script>
<link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a href="/dashboard/dashboard.html" class="logo">
        <img src=" /images/logo.jpeg" alt="BOG Cloud Logo" class="logo-img" onerror="this.style.display='none';">
      </a>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="themeToggle" title="Toggle Theme">Dark</button>
    </div>
  </div>

  <div class="container">
    <a href="/dashboard/dashboard.html" class="back-link">← Back to Drive</a>

    <div class="profile-card">
      <div id="alertBox" class="alert"></div>

      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">B</div>
        <div class="profile-info">
          <h1 id="profileName">Loading...</h1>
          <p id="profileEmail">loading@email.com</p>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Personal Info</div>
        <div class="row">
          <div>
            <div class="row-label">Display Name</div>
            <div class="row-value" id="displayName">User</div>
          </div>
          <button class="btn btn-outline" onclick="toggleNameForm()">Edit</button>
        </div>
        <div class="inline-form" id="nameForm">
          <div class="form-group">
            <label>New Display Name</label>
            <input type="text" id="newNameInput" placeholder="Enter your name">
          </div>
          <button class="btn" id="saveNameBtn" onclick="saveName()">Save Name</button>
          <button class="btn btn-secondary" onclick="toggleNameForm()">Cancel</button>
        </div>

        <div class="row">
          <div>
            <div class="row-label">Email</div>
            <div class="row-value" id="displayEmail">user@email.com</div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Security</div>
        <button class="btn btn-outline" onclick="togglePasswordForm()">Change Password</button>

        <div class="inline-form" id="passwordForm">
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="currentPassword" placeholder="Enter your current password">
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password, min 6 characters">
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password">
          </div>
          <button class="btn" id="updatePassBtn" onclick="savePassword()">Update Password</button>
          <button class="btn btn-secondary" onclick="togglePasswordForm()">Cancel</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Account</div>
        <button class="btn btn-danger" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </div>

<script type="module" src="javascript/profile-2.js"></script>
</body>
</html>
