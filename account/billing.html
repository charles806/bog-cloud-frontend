<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing — BOG Cloud</title>
<meta name="description" content="Your plan, usage and upgrade options.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/images/logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="/assets/js/theme-boot.js"></script>
</head>
<body data-nav="app">
<a class="skip-link" href="#main">Skip to main content</a>
<div data-shell-topbar></div>
<div class="shell">
  <aside data-shell-sidebar></aside>
  <main class="main" id="main" data-shell-main>
    <div class="page__head">
      <div>
        <h1 class="page__title">Billing & Storage</h1>
        <p class="page__sub">Your plan, usage and upgrade options.</p>
      </div>
    </div>
    <div id="alert" class="alert is-hidden" role="status" aria-live="polite"></div>
    <div id="alertBox" class="alert is-hidden" role="status" aria-live="polite"></div>

    <section class="section">
      <div class="card">
        <h2 class="section__title">Current plan</h2>
        <p style="color:var(--muted)">Free Plan — <strong id="storageUsed">0.00 GB</strong> of 50 GB used</p>
        <div class="progress" style="margin-top:var(--s-3)"><div class="progress-bar" id="storageBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div>
      </div>
    </section>
    <section class="section">
      <h2 class="section__title">Upgrade storage</h2>
      <div class="plan-grid">
        <div class="plan" data-plan="100GB" data-price="1500">
          <h3 class="plan__name">100 GB</h3>
          <div class="plan__price">₦1,500<small>/mo</small></div>
          <button class="btn btn--ghost plan-select" type="button">Upgrade</button>
        </div>
        <div class="plan" data-plan="200GB" data-price="3000">
          <h3 class="plan__name">200 GB</h3>
          <div class="plan__price">₦3,000<small>/mo</small></div>
          <button class="btn btn--ghost plan-select" type="button">Upgrade</button>
        </div>
        <div class="plan plan--current" data-plan="2TB" data-price="7500">
          <h3 class="plan__name">2 TB</h3>
          <div class="plan__price">₦7,500<small>/mo</small></div>
          <button class="btn btn--primary plan-select" type="button">Selected</button>
        </div>
      </div>
      <div class="card" style="margin-top:var(--s-4)"><strong>Selected plan:</strong> <span id="summaryText">2 TB - ₦7,500/month</span><span id="selectedSummary" class="is-hidden"></span></div>
    </section>

  </main>
</div>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/forms.js"></script>
<script src="/assets/js/shell.js"></script>
<script type="module" src="javascript/billing-2.js"></script>
</body>
</html>
