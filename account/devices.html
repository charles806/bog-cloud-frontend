<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devices - BOG Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script>
// Apply theme ASAP to prevent white flash
(function(){
  const saved = localStorage.getItem('bog-theme');
  if(saved === 'dark') document.documentElement.classList.add('dark');
})();
</script>
<style>
  :root{
    --google-blue: #1A73E8;
    --white: #FFFFFF;
    --gray-900: #202124;
    --gray-700: #5F6368;
    --gray-100: #F1F3F4;
    --sidebar-bg: #FFFFFF;
    --card-bg: #FFFFFF;
    --border: #DADCE0;
    --red: #D93025;
    --hover-bg: #F1F3F4;
  }
  :root.dark{
    --white: #1F1F1F;
    --gray-900: #E8EAED;
    --gray-700: #9AA0A6;
    --gray-100: #202124;
    --sidebar-bg: #292A2D;
    --card-bg: #292A2D;
    --border: #5F6368;
    --hover-bg: #3C4043;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Roboto', Arial, sans-serif;}
  body{background:var(--gray-100);color:var(--gray-900);transition:background 0.3s,color 0.3s;}
.topbar{height:64px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:16px;}
.hamburger{background:none;border:none;font-size:24px;cursor:pointer;color:var(--gray-700);padding:8px;display:block;}
.logo{display:flex;align-items:center;text-decoration:none;}
.logo-img{width:80px;height:80px;object-fit:cover;object-position:center;background:transparent;flex-shrink:0;} /* LOGO ZOOM */
.topbar-right{display:flex;align-items:center;gap:12px;position:relative;}
.icon-btn{background:none;border:none;font-size:14px;font-weight:500;cursor:pointer;color:var(--gray-700);padding:8px 12px;border-radius:8px;border:1px solid var(--border);}
.icon-btn:hover{background:var(--hover-bg);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--google-blue);color:var(--white);display:grid;place-items:center;font-weight:500;font-size:14px;cursor:pointer;}
.account-menu{display:none;position:absolute;right:0;top:48px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 2px 10px rgba(60,64,67,.3);padding:16px;width:320px;z-index:200;}
.account-menu.open{display:block;}
.container{display:flex;}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:90;}
.overlay.open{display:block;}
.sidebar{width:280px;background:var(--sidebar-bg);padding:16px 8px;height:calc(100vh - 64px);position:fixed;top:64px;left:0;overflow-y:auto;z-index:95;transition:transform 0.3s,background 0.3s;transform:translateX(-100%);}
.sidebar.open{transform:translateX(0);}
.nav-title{font-size:11px;font-weight:600;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px 16px;}
.nav-link{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:0 24px 24px 0;color:var(--gray-700);text-decoration:none;font-size:14px;font-weight:500;}
.nav-link:hover{background:var(--hover-bg);}
.nav-link.active{background:#E8F0FE;color:var(--google-blue);font-weight:500;}
.nav-ico{width:24px;height:24px;display:grid;place-items:center;}
.nav-ico svg{width:24px;height:24px;fill:currentColor;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.main{flex:1;padding:24px 32px;margin-left:0;transition:margin-left 0.3s;}
.main.shifted{margin-left:280px;}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 1px 2px rgba(60,64,67,.1);margin-bottom:24px;transition:background 0.3s;}

.device-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px;
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:12px;
  transition:0.2s;
  background:var(--card-bg);
}
.device-item:hover{background:var(--hover-bg);}
.device-info{display:flex;align-items:center;gap:16px;}
.device-icon{width:40px;height:40px;background:#E8F0FE;border-radius:8px;display:grid;place-items:center;}
.device-icon svg{width:24px;height:24px;fill:var(--google-blue);}
.device-name{font-weight:500;font-size:14px;}
.device-meta{font-size:12px;color:var(--gray-700);}
.device-status{font-size:12px;color:#188038;font-weight:500;}
.btn-danger{
  background:var(--card-bg);
  color:var(--red);
  border:1px solid var(--red);
  padding:8px 16px;
  border-radius:8px;
  font-weight:500;
  cursor:pointer;
  font-size:13px;
}
.btn-danger:hover{background:#FCE8E6;}
.current-badge{background:#E6F4EA;color:#188038;padding:4px 12px;border-radius:16px;font-size:12px;font-weight:500;}

  @media(max-width:1024px){
.main{padding:16px;}
.main.shifted{margin-left:0;}
  }
  @media(max-width:768px){
.logo-img{width:64px;height:64px;} /* MOBILE LOGO ZOOM */
.device-item{flex-direction:column;align-items:flex-start;gap:12px;}
.btn-danger{width:100%;}
.card{padding:16px;}
    h2{font-size:20px!important;}
  }
</style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <a href="/dashboard/dashboard.html" class="logo">
        <img src=" /images/logo.jpeg" alt="BOG Cloud Logo" class="logo-img" onerror="this.style.display='none';">
      </a>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="themeToggle" title="Toggle Theme">Dark</button>
      <span id="userFirstName" style="font-size:14px;font-weight:500;"></span>
      <div class="avatar" id="userAvatar" onclick="toggleAccountMenu()">B</div>
      <div class="account-menu" id="accountMenu">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
          <div class="avatar" id="menuAvatar">B</div>
          <div><div id="menuUserName" style="font-weight:500;">User</div><div id="menuUserEmail" style="font-size:12px; color:var(--gray-700);">user@email.com</div></div>
        </div>
        <div class="divider" style="margin:8px 0;"></div>
        <a href="profile.html" style="display:block;padding:10px 0;text-decoration:none;color:var(--gray-900);">Manage your BOG Account</a>
        <a href="#" onclick="logout()" style="display:block;padding:10px 0;text-decoration:none;color:#D93025;">Sign out</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="sidebar" id="sidebar">
      <div class="nav-title">Cloud</div>
      <a href="/dashboard/dashboard.html" class="nav-link"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2h-8l-2-2z"/></svg></span> My Drive</a>
      <a href="/dashboard/vault.html" class="nav-link"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg></span> Vault</a>
      <a href="/dashboard/trash.html" class="nav-link"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></span> Trash</a>

      <div class="divider"></div>
      <div class="nav-title">Account</div>
      <a href="profile.html" class="nav-link"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span> Profile</a>
      <a href="billing.html" class="nav-link"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg></span> Billing</a>
      <a href="devices.html" class="nav-link active"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2-.9-2-2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg></span> Devices</a>
      <a href="sessions.html" class="nav-link"><span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2.9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2.9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></span> Sessions</a>
    </div>

    <div class="main" id="main">
      <h2 style="font-weight:400;font-size:24px;margin-bottom:8px;">Your Devices</h2>
      <p style="color:var(--gray-700);margin-bottom:24px;">Devices that are currently signed in to your BOG Account</p>

      <div class="card">
        <div id="devicesList"></div>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyD7Ve_lk5waFwPNcQwHxM9DpYFkeEsQa74",authDomain: "bog-cloud.firebaseapp.com",projectId: "bog-cloud",storageBucket: "bog-cloud.appspot.com",messagingSenderId: "219071508992",appId: "1:219071508992:web:42516a44ed5d2f6a59dee5"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;

// DARK MODE
function updateThemeButton(){
  const isDark = document.documentElement.classList.contains('dark');
  document.getElementById('themeToggle').textContent = isDark? 'Light' : 'Dark';
}
function toggleTheme(){
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('bog-theme', document.documentElement.classList.contains('dark')? 'dark' : 'light');
  updateThemeButton();
}
document.getElementById('themeToggle').onclick = toggleTheme;
updateThemeButton();

function toggleSidebar() {document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open');if(window.innerWidth > 1024){document.getElementById('main').classList.toggle('shifted');}}
window.toggleSidebar = toggleSidebar;
window.toggleAccountMenu = () => {document.getElementById('accountMenu').classList.toggle('open');}
window.logout = async () => { await signOut(auth); window.location.href = '/auth/login.html'; }

function getDeviceIcon(userAgent){
  if(/Android/i.test(userAgent)) return `<svg viewBox="0 0 24 24"><path d="M17.5 2h-11C5.12 2 4 3.12 4 4.5v15C4 20.88 5.12 22 6.5 22h11c1.38 0 2.5-1.12 2.5-2.5v-15C20 3.12 18.88 2 17.5 2zM6.5 20c-.28 0-.5-.22-.5-.5v-15c0-.28.22-.5.5-.5h11c.28 0.5.22.5.5v15c0.28-.22.5-.5.5h-11z"/></svg>`;
  if(/iPhone|iPad/i.test(userAgent)) return `<svg viewBox="0 0 24 24"><path d="M17 2H7c-1.1 0-2-2 2v16c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM7 16.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM17 18H7V4h10v14z"/></svg>`;
  return `<svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>`;
}

function getDeviceName(userAgent){
  if(/Windows/i.test(userAgent)) return "Windows PC";
  if(/Macintosh/i.test(userAgent)) return "Mac";
  if(/Android/i.test(userAgent)) return "Android Device";
  if(/iPhone/i.test(userAgent)) return "iPhone";
  if(/iPad/i.test(userAgent)) return "iPad";
  return "Browser";
}

function showCurrentDevice(){
  const devicesList = document.getElementById('devicesList');
  devicesList.innerHTML = `
    <div class="device-item">
      <div class="device-info">
        <div class="device-icon">${getDeviceIcon(navigator.userAgent)}</div>
        <div>
          <div class="device-name">${getDeviceName(navigator.userAgent)} <span class="current-badge">This device</span></div>
          <div class="device-meta">Lagos, Nigeria • Active now</div>
        </div>
      </div>
      <span class="device-status">Active now</span>
    </div>
  `;
}

async function loadDevicesFromFirebase(user){
  const devicesSnap = await getDocs(query(collection(db, "devices"), where("uid", "==", user.uid)));
  const devicesList = document.getElementById('devicesList');
  let html = '';
  const currentSessionId = sessionStorage.getItem('sessionId');

  devicesSnap.forEach(d => {
    const data = d.data();
    const isCurrent = data.sessionId === currentSessionId;
    html += `
      <div class="device-item">
        <div class="device-info">
          <div class="device-icon">${getDeviceIcon(data.userAgent)}</div>
          <div>
            <div class="device-name">${data.deviceName} ${isCurrent? '<span class="current-badge">This device</span>' : ''}</div>
            <div class="device-meta">${data.location || 'Lagos, Nigeria'} • Last active: ${data.lastActive? new Date(data.lastActive.seconds * 1000).toLocaleString() : 'Just now'}</div>
          </div>
        </div>
        ${!isCurrent? `<button class="btn-danger" onclick="signOutDevice('${d.id}')">Sign out</button>` : '<span class="device-status">Active now</span>'}
      </div>
    `;
  });

  if(html) devicesList.innerHTML = html;
}

window.signOutDevice = async (deviceId) => {
  if(confirm('Sign out this device?')){
    await deleteDoc(doc(db, "devices", deviceId));
    loadDevicesFromFirebase(currentUser);
  }
}

async function registerDevice(user){
  const sessionId = Date.now().toString();
  sessionStorage.setItem('sessionId', sessionId);
  await addDoc(collection(db, "devices"), {
    uid: user.uid,
    deviceName: getDeviceName(navigator.userAgent),
    userAgent: navigator.userAgent,
    location: "Lagos, Nigeria",
    sessionId: sessionId,
    lastActive: serverTimestamp()
  });
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const firstName = user.displayName? user.displayName.split(' ')[0] : user.email.split('@')[0];
    const initial = firstName[0].toUpperCase();
    document.getElementById('userFirstName').textContent = firstName;
    document.getElementById('userAvatar').textContent = initial;
    document.getElementById('menuAvatar').textContent = initial;
    document.getElementById('menuUserName').textContent = user.displayName || firstName;
    document.getElementById('menuUserEmail').textContent = user.email;

    showCurrentDevice();
    await registerDevice(user);
    setTimeout(()=> loadDevicesFromFirebase(user), 1500);
  } else { window.location.href = '/auth/login.html'; }
});
</script>
</body>
</html>
