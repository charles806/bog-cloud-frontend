    <div class="page__head">
      <div>
        <h1 class="page__title">Your Sessions</h1>
        <p class="page__sub">Recent activity on your BOG account.</p>
      </div>
    </div>
    <div id="alert" class="alert is-hidden" role="status" aria-live="polite"></div>
    <div id="alertBox" class="alert is-hidden" role="status" aria-live="polite"></div>

    <section class="section">
      <div class="cluster"><button class="btn btn--danger" type="button" id="signOutOthersBtn">Sign out of all other sessions</button></div>

      <div class="section__head">
        <h2 class="section__title">Recent activity</h2>
        <span class="result-count" id="sessionsCount"></span>

      <div id="sessionsList" class="timeline" role="list"></div>
      <div class="empty-state is-hidden" id="sessionsEmpty"><h3>No sessions</h3><p>No recent activity.</p></div>

  </main>
