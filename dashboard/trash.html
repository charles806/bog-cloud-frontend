<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trash - BOG Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/trash.css">
</head>
<body>

<div class="trash-container">
  <div class="trash-header">
    <h1>Trash</h1>
    <button class="btn btn-empty" onclick="emptyTrash()">Empty Trash</button>
  </div>
  <div id="trashContent">
    <table class="trash-table">
      <thead><tr><th>Name</th><th>Deleted</th><th>Actions</th></tr></thead>
      <tbody id="trashList"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">Trash is empty</div>
  </div>
</div>

<script type="module" src="javascript/trash-1.js"></script>
</body>
</html>
