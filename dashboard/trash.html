<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trash - BOG Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --google-blue: #1A73E8; --white: #FFFFFF; --gray-900: #202124; --gray-700: #5F6368; --gray-100: #F1F3F4; --border: #DADCE0; --red: #D93025;}
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Roboto', Arial, sans-serif;}
  body{background:var(--gray-100);color:var(--gray-900);padding:24px;}
  .trash-container{max-width:900px;margin:0 auto;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:24px;}
  .trash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .trash-header h1{font-size:24px;font-weight:500;}
  .btn{border:none;padding:8px 16px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;}
  .btn-restore{background:var(--google-blue);color:var(--white);}
  .btn-delete{background:var(--red);color:var(--white);}
  .btn-empty{background:transparent;color:var(--gray-700);border:1px solid var(--border);}
  .trash-table{width:100%;border-collapse:collapse;}
  .trash-table th{padding:12px 16px;text-align:left;font-size:12px;font-weight:500;color:var(--gray-700);border-bottom:1px solid var(--border);background:#FAFBFC;}
  .trash-table td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--gray-100);}
  .actions{display:flex;gap:8px;}
  .empty-state{text-align:center;padding:60px 0;color:var(--gray-700);}
</style>
</head>
<body>

<div class="trash-container">
  <div class="trash-header">
    <h1>Trash</h1>
    <button class="btn btn-empty" onclick="emptyTrash()">Empty Trash</button>
  </div>
  <div id="trashContent">
    <table class="trash-table">
      <thead><tr><th>Name</th><th>Deleted</th><th>Actions</th></tr></thead>
      <tbody id="trashList"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">Trash is empty</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where, deleteDoc, doc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7Ve_lk5waFwPNcQwHxM9DpYFkeEsQa74",
  authDomain: "bog-cloud.firebaseapp.com",
  projectId: "bog-cloud",
  storageBucket: "bog-cloud.appspot.com",
  messagingSenderId: "219071508992",
  appId: "1:219071508992:web:42516a44ed5d2f6a59dee5"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    loadTrash();
  } else { window.location.href = '/auth/login.html'; }
});

async function loadTrash(){
  const q = query(collection(db, "trash"), where("uid", "==", currentUser.uid));
  const snapshot = await getDocs(q);
  const tbody = document.getElementById('trashList');
  tbody.innerHTML = '';
  
  if(snapshot.empty){
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const deletedDate = data.deletedAt?.toDate().toLocaleDateString() || 'N/A';
    tbody.innerHTML += `
      <tr>
        <td>${data.name}</td>
        <td>${deletedDate}</td>
        <td class="actions">
          <button class="btn btn-restore" onclick="restoreFile('${docSnap.id}', '${data.name}', '${data.url}', ${data.size})">Restore</button>
          <button class="btn btn-delete" onclick="deletePermanent('${docSnap.id}')">Delete</button>
        </td>
      </tr>
    `;
  });
}

window.restoreFile = async (id, name, url, size) => {
  await addDoc(collection(db, "files"), {uid: currentUser.uid, name, url, size, createdAt: serverTimestamp()});
  await deleteDoc(doc(db, "trash", id));
  loadTrash();
  alert("Restored to My Drive");
}

window.deletePermanent = async (id) => {
  if(confirm("Delete permanently?")){
    await deleteDoc(doc(db, "trash", id));
    loadTrash();
  }
}

window.emptyTrash = async () => {
  if(!confirm("Delete everything in trash?")) return;
  const q = query(collection(db, "trash"), where("uid", "==", currentUser.uid));
  const snapshot = await getDocs(q);
  snapshot.forEach(d => deleteDoc(doc(db, "trash", d.id)));
  loadTrash();
}
</script>
</body>
</html>
