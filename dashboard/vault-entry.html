<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault Entry - BOG Cloud</title>
<style>
  :root{ --bog-blue: #1A73E8; --bog-blue-hover: #1765CC; --white: #FFFFFF; --gray-800: #202124; --gray-600: #5F6368; --gray-100: #F1F3F4; --sidebar: #FAFBFC; }
  *{margin:0;padding:0;box-sizing:border-box;font-family: Roboto, Arial, sans-serif;}
  body{background:var(--gray-100);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px;}
.card{background:var(--white);border:1px solid #E8EAED;border-radius:12px;padding:32px;width:100%;max-width:500px;}
h2{margin-bottom:24px;font-weight:400;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;color:var(--gray-800);}
input, select{width:100%;padding:12px;border:1px solid #E8EAED;border-radius:8px;font-size:14px;}
.btn-brand{padding:12px 24px;border:none;border-radius:24px;background:var(--bog-blue);color:var(--white);font-size:14px;font-weight:500;cursor:pointer;width:100%;}
.btn-brand:hover{background:var(--bog-blue-hover);}
.btn-secondary{padding:12px 24px;border:1px solid #E8EAED;border-radius:24px;background:var(--white);color:var(--gray-800);font-size:14px;font-weight:500;cursor:pointer;width:100%;margin-top:8px;text-decoration:none;display:block;text-align:center;}
</style>
</head>
<body>
  <div class="card">
    <h2 id="formTitle">New Vault Entry</h2>
    <div class="form-group">
      <label>Type</label>
      <select id="type">
        <option value="Password">Password</option>
        <option value="Note">Secure Note</option>
        <option value="Card">Credit Card</option>
      </select>
    </div>
    <div class="form-group"><label>Title</label><input id="title" placeholder="Netflix"></div>
    <div class="form-group"><label>Username / Email</label><input id="username" placeholder="user@email.com"></div>
    <div class="form-group"><label>Password</label><input id="password" type="password" placeholder="••••"></div>
    <div class="form-group"><label>URL</label><input id="url" placeholder="https://netflix.com"></div>
    <button class="btn-brand" onclick="saveEntry()">Save Entry</button>
    <a href="vault.html" class="btn-secondary">Cancel</a>
  </div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDoc, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
const app = initializeApp({apiKey:"AIzaSyD7Ve_lk5waFwPNcQwHxM9DpYFkeEsQa74",authDomain:"bog-cloud.firebaseapp.com",projectId:"bog-cloud",storageBucket:"bog-cloud.firebasestorage.app",messagingSenderId:"219071508992",appId:"1:219071508992:web:42516a44ed5d2f6a59dee5"});
const auth = getAuth(app); const db = getFirestore(app);
const params = new URLSearchParams(window.location.search); const editId = params.get('id'); let currentUser = null;

onAuthStateChanged(auth, user => { if(user){ currentUser=user; if(editId) loadEntry(editId); } else window.location.href='/auth/login.html'; });

async function loadEntry(id){
  document.getElementById('formTitle').textContent = "Edit Vault Entry";
  const snap = await getDoc(doc(db,"vault",id));
  const data = snap.data();
  document.getElementById('type').value = data.type;
  document.getElementById('title').value = data.title;
  document.getElementById('username').value = data.username;
  document.getElementById('password').value = data.password;
  document.getElementById('url').value = data.url;
}

window.saveEntry = async () => {
  const data = {
    uid: currentUser.uid, type: type.value, title: title.value, username: username.value,
    password: password.value, url: url.value, updatedAt: serverTimestamp()
  };
  if(editId){ await updateDoc(doc(db,"vault",editId), data); }
  else { await addDoc(collection(db,"vault"), {...data, createdAt: serverTimestamp()}); }
  window.location.href = 'vault.html';
}
</script>
</body>
</html>
