<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Vault - BOG Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vault.css">
</head>
<body>

<div class="vault-container">
  <div class="vault-header">
    <h1>Password Vault</h1>
    <button class="btn btn-primary" onclick="openModal()">
      <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Add Password
    </button>
  </div>
  <div id="vaultList"></div>
</div>

<!-- Add/Edit Modal -->
<div class="modal" id="vaultModal">
  <div class="modal-content">
    <h2 id="modalTitle">Add New Password</h2>
    <input type="text" id="siteInput" placeholder="Website e.g. google.com">
    <input type="email" id="emailInput" placeholder="Email / Username">
    <input type="password" id="passwordInput" placeholder="Password">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="savePassword()">Save</button>
    </div>
  </div>
</div>

<script type="module" src="javascript/vault-1.js"></script>
</body>
</html>
