<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - BOG Cloud</title>
<link rel="stylesheet" href="css/signup.css">
</head>
<body>
  <div class="card">
    <a href="../index.html"><img src="../images/logo.jpeg" alt="BOG Cloud Logo" class="hero-logo-img"></a>
    <h2>Create your BOG account</h2>

    <form id="signupForm">
      <div class="input-group name-row">
        <input id="firstName" type="text" placeholder="First Name" required>
        <input id="lastName" type="text" placeholder="Last Name" required>
      </div>
      <div class="input-group"><input id="email" type="email" placeholder="Email" required></div>
      <div class="input-group">
        <input id="password" type="password" placeholder="Password" required>
        <div class="hint">Min 8 chars, 1 uppercase, 1 number, 1 special char</div>
      </div>
      <button type="submit" class="btn-brand" id="signupBtn">Sign up</button>
    </form>

    <div id="error" class="error-msg"></div>
    <div id="success" class="success-msg"></div>
    <div class="footer-link">Already have an account? <a href="login.html" class="link">Login</a></div>
  </div>

<script src="javascript/signup-1.js"></script>
</body>
</html>
