<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email - BOG Cloud</title>
<link rel="stylesheet" href="css/verify-otp.css">
</head>
<body>
  <div class="card">
    <div class="logo-b">B</div>
    <h2>Verify your email</h2>
    <p>We sent a verification link to <strong id="userEmail">your email</strong>. Click the link, then come back and click below.</p>
   
    <button class="btn-brand" onclick="checkVerification()">I've verified my email</button>
    <button class="btn-outline" onclick="resendEmail()">Resend verification email</button>
   
    <div class="footer-link">
      Wrong email? <a href="#" class="link" onclick="goToSignup()">Go back to Sign up</a>
    </div>
    <div id="error" class="error-msg"></div>
  </div>

<script type="module" src="javascript/verify-otp-1.js"></script>
</body>
</html>
