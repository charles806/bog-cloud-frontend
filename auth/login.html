<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - BOG Cloud</title>
<style>
  :root{ --bog-blue: #1A73E8; --bog-blue-hover: #1765CC; --white: #FFFFFF; --gray-800: #202124; --gray-600: #5F6368; --gray-100: #F1F3F4; --error: #D93025; --success: #188038; }
  *{margin:0;padding:0;box-sizing:border-box;font-family: Roboto, Arial, sans-serif;}
  body{background:var(--gray-100);display:grid;place-items:center;min-height:100vh;padding:24px;}
  .card{background:var(--white);border:1px solid #E8EAED;border-radius:12px;padding:40px;max-width:450px;width:100%;text-align:center;}
  .hero-logo-img{ width:160px; height:auto; object-fit:contain; display:block; margin:0 auto 24px; transition:0.2s; }
  .hero-logo-img:hover{opacity:0.8;}
  h1{text-align:center;font-size:24px;font-weight:400;margin-bottom:8px;}
  .sub{text-align:center;color:var(--gray-600);margin-bottom:24px;}
  .form-group{margin-bottom:16px;text-align:left;}
  label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;}
  input{width:100%;padding:12px 16px;border:1px solid #DADCE0;border-radius:8px;font-size:16px;}
  input:focus{outline:none;border-color:var(--bog-blue);}
  .btn-brand{width:100%;padding:12px;border:none;border-radius:24px;background:var(--bog-blue);color:var(--white);font-size:16px;font-weight:500;cursor:pointer;}
  .btn-brand:hover{background:var(--bog-blue-hover);}
  .btn-brand:disabled{background:#ccc;cursor:not-allowed;}
  .link{text-align:center;margin-top:16px;font-size:14px;}
  .link a{color:var(--bog-blue);text-decoration:none;}
  .alert{padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;display:none;}
  .alert.error{background:#FCE8E6;color:var(--error);}
  .alert.success{background:#E6F4EA;color:var(--success);}
</style>
</head>
<body>
  <div class="card">
    <!-- FIXED: Absolute path for Vercel -->
    <a href="/index.html"><img src="../images/logo.jpeg" alt="BOG Cloud Logo" class="hero-logo-img"></a> 
    <h1>Sign in</h1>
    <p class="sub">to continue to BOG Cloud</p>
    <div id="alert" class="alert"></div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group"><label>Email</label><input type="email" id="email" autocomplete="off" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" autocomplete="new-password" required></div>
      <button type="submit" class="btn-brand" id="loginBtn">Login</button>
    </form>
    <div class="link">Don't have an account? <a href="/auth/signup.html">Create one</a></div>
    <div class="link"><a href="/auth/reset-password.html">Forgot password?</a></div>
  </div>

<script>
const API_BASE = 'https://bog-cloud-1.onrender.com';

const form = document.getElementById('loginForm');
const alertBox = document.getElementById('alert');
const loginBtn = document.getElementById('loginBtn');

function showAlert(msg, type) { 
  alertBox.textContent = msg; 
  alertBox.className = `alert ${type}`; 
  alertBox.style.display = 'block'; 
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginBtn.disabled = true; 
  loginBtn.textContent = 'Signing in...'; 
  alertBox.style.display = 'none';
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const res = await fetch(API_BASE + '/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));

      showAlert('Login successful! Redirecting...', 'success');
      // FIXED: Absolute path for Vercel
      setTimeout(() => window.location.href = '/dashboard/dashboard.html', 1000);
    } else {
      showAlert(data.message || 'Invalid email or password', 'error');
      loginBtn.disabled = false; 
      loginBtn.textContent = 'Login';
    }
  } catch (error) {
    showAlert('Network error. Is the backend awake?', 'error');
    loginBtn.disabled = false; 
    loginBtn.textContent = 'Login';
  }
});
</script>
</body>
</html>
