<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - BOG Cloud</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="card">
    <!-- FIXED: Absolute path for Vercel -->
    <a href="/index.html"><img src="../images/logo.jpeg" alt="BOG Cloud Logo" class="hero-logo-img"></a> 
    <h1>Sign in</h1>
    <p class="sub">to continue to BOG Cloud</p>
    <div id="alert" class="alert"></div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group"><label>Email</label><input type="email" id="email" autocomplete="off" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" autocomplete="new-password" required></div>
      <button type="submit" class="btn-brand" id="loginBtn">Login</button>
    </form>
    <div class="link">Don't have an account? <a href="/auth/signup.html">Create one</a></div>
    <div class="link"><a href="/auth/reset-password.html">Forgot password?</a></div>
  </div>

<script src="javascript/login-1.js"></script>
</body>
</html>
