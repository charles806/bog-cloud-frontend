<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - BOG Cloud</title>
<style>
  :root{ --bog-blue: #1A73E8; --bog-blue-hover: #1765CC; --white: #FFFFFF; --gray-800: #202124; --gray-600: #5F6368; --gray-100: #F1F3F4; --error: #D93025; --success: #188038; }
  *{margin:0;padding:0;box-sizing:border-box;font-family: Roboto, Arial, sans-serif;}
  body{background:var(--gray-100);display:grid;place-items:center;min-height:100vh;padding:24px;}
  .card{background:var(--white);border:1px solid #E8EAED;border-radius:12px;padding:40px;max-width:450px;width:100%;text-align:center;}
  
  /* GOOGLE SIZE LOGO */
  .hero-logo-img{
    width:160px;
    height:auto;
    object-fit:contain;
    display:block;
    margin:0 auto 24px;
    transition:0.2s;
  }
  .hero-logo-img:hover{opacity:0.8;}

  h1{text-align:center;font-size:24px;font-weight:400;margin-bottom:8px;}
  .sub{text-align:center;color:var(--gray-600);margin-bottom:24px;}
  .form-group{margin-bottom:16px;text-align:left;}
  label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;}
  input{width:100%;padding:12px 16px;border:1px solid #DADCE0;border-radius:8px;font-size:16px;}
  input:focus{outline:none;border-color:var(--bog-blue);}
  .btn-brand{width:100%;padding:12px;border:none;border-radius:24px;background:var(--bog-blue);color:var(--white);font-size:16px;font-weight:500;cursor:pointer;}
  .btn-brand:hover{background:var(--bog-blue-hover);}
  .btn-brand:disabled{background:#ccc;cursor:not-allowed;}
  .link{text-align:center;margin-top:16px;font-size:14px;}
  .link a{color:var(--bog-blue);text-decoration:none;}
  .alert{padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;display:none;}
  .alert.error{background:#FCE8E6;color:var(--error);}
  .alert.success{background:#E6F4EA;color:var(--success);}
</style>
</head>
<body>
  <div class="card">
    <a href="/index.html"><img src=" /images/logo.jpeg" alt="BOG Cloud Logo" class="hero-logo-img"></a> <!-- FIXED -->
    <h1>Sign in</h1>
    <p class="sub">to continue to BOG Cloud</p>
    <div id="alert" class="alert"></div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group"><label>Email</label><input type="email" id="email" autocomplete="off" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" autocomplete="new-password" required></div>
      <button type="submit" class="btn-brand" id="loginBtn">Login</button>
    </form>
    <div class="link">Don't have an account? <a href="/auth/signup.html">Create one</a></div>
    <div class="link"><a href="reset-password.html">Forgot password?</a></div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7Ve_lk5waFwPNcQwHxM9DpYFkeEsQa74",
  authDomain: "bog-cloud.firebaseapp.com",
  projectId: "bog-cloud",
  storageBucket: "bog-cloud.firebasestorage.app",
  messagingSenderId: "219071508992",
  appId: "1:219071508992:web:42516a44ed5d2f6a59dee5",
  measurementId: "G-GBSSD1DLQC"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

setPersistence(auth, browserSessionPersistence);

const form = document.getElementById('loginForm');
const alertBox = document.getElementById('alert');
const loginBtn = document.getElementById('loginBtn');

function showAlert(msg, type) { alertBox.textContent = msg; alertBox.className = `alert ${type}`; alertBox.style.display = 'block'; }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginBtn.disabled = true; loginBtn.textContent = 'Signing in...'; alertBox.style.display = 'none';
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    if (user.emailVerified) {
      showAlert('Login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = '/dashboard/dashboard.html', 1000);
    } else {
      showAlert('Please verify your email first. Check your inbox.', 'error');
      await signOut(auth);
      setTimeout(() => window.location.href = 'verify-otp.html', 1500);
    }
  } catch (error) {
    showAlert(error.message, 'error');
    loginBtn.disabled = false; loginBtn.textContent = 'Login';
  }
});
</script>
</body>
</html>
