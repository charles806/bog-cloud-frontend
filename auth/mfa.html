<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two-Factor Authentication - BOG Cloud</title>
<link rel="stylesheet" href="css/mfa.css">
</head>
<body>
  <div class="card">
    <div class="logo-b">B</div>
    <h2>Two-Factor Authentication</h2>
    <p>Enter the 6-digit code we sent to <strong id="userEmail">your email</strong> to secure your account.</p>
    
    <div class="input-group">
      <input id="otpCode" type="text" placeholder="000" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    </div>

    <button class="btn-brand" onclick="verifyMFA()">Verify & Continue</button>
    <button class="btn-outline" onclick="resendCode()">Resend Code</button>
    <div id="error" class="error-msg"></div>
    
    <div class="footer-link">
      <a href="verify-otp.html" class="link" onclick="window.location.href='verify-otp.html'">Back</a>
      <a href="/dashboard/dashboard.html" class="link" onclick="window.location.href='/dashboard/dashboard.html'">Skip for now</a>
    </div>
  </div>

<script type="module" src="javascript/mfa-1.js"></script>
</body>
</html>
