<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - BOG Cloud</title>
<link rel="stylesheet" href="css/reset-password.css">
</head>
<body>
  <div class="card">
    <a href="/index.html"><img src=" /images/logo.jpeg" alt="BOG Cloud Logo" class="hero-logo-img"></a> <!-- FIXED -->
    <h2>Reset your password</h2>
    <p>Enter your email and we'll send you a link to reset your password.</p>
    
    <div class="input-group">
      <input id="email" type="email" placeholder="Email" autocomplete="email">
    </div>

    <button id="resetBtn" class="btn-brand" onclick="resetPassword()">Send Reset Link</button>
    <div id="error" class="error-msg"></div>
    
    <div class="footer-link">
      Remember your password? <a href="/auth/login.html" class="link">Back to Login</a>
    </div>
  </div>

<script type="module" src="javascript/reset-password-1.js"></script>
</body>
</html>
