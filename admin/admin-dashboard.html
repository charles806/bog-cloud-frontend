<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOG Cloud - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <link rel="stylesheet" href="css/admin-dashboard.css">
</head>
<body>

    <!-- HEADER -->
    <header class="navbar">
        <div class="nav-left">
            <button class="hamburger" id="hamburger-btn">
                <span class="material-icons">menu</span>
            </button>
            <img src=" /images/logo.jpeg" alt="BOG Cloud Logo" class="logo"> 
            <h1>BOG Cloud</h1>
        </div>
        <div class="nav-right">
            <!-- REAL ICON THEME TOGGLE -->
            <button class="theme-toggle" id="theme-toggle" title="Toggle Theme">
                <span class="material-icons" id="theme-icon">dark_mode</span>
            </button>
            <div class="user-avatar">U</div>
        </div>
    </header>

    <!-- OVERLAY TO CLOSE SIDEBAR -->
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <ul id="sidebar-menu"></ul>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <h2>Admin Dashboard</h2>
            <p>Overview</p>
            
            <div class="card-grid">
                <div class="card">
                    <div class="label">Total Users</div>
                    <div class="value">1,248</div>
                    <div class="change">+12.5% this month</div>
                </div>
                <div class="card">
                    <div class="label">Total Storage Used</div>
                    <div class="value">4.2 TB</div>
                    <div class="change">+8.2% this month</div>
                </div>
                <div class="card">
                    <div class="label">Monthly Revenue</div>
                    <div class="value">$12,430</div>
                </div>
                <div class="card">
                    <div class="label">API Calls</div>
                    <div class="value">1.2M</div>
                </div>
            </div>
        </main>
    </div>

    <script src="javascript/admin-dashboard-1.js"></script>
</body>
</html>
