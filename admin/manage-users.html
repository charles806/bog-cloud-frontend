<div data-shell-topbar></div>
<div class="shell">
  <aside data-shell-sidebar></aside>
  <main class="main" id="main" data-shell-main>

      <div>
        <h1 class="page__title">Manage Users</h1>

      </div>

      <div class="filter-bar">

      </div>

          <caption class="sr-only">Manage users</caption>

        </table>
      </div>
      <div class="empty-state is-hidden" id="manageEmpty"><h2>No users</h2><p>No accounts to manage.</p></div>
      <div class="empty-state is-hidden" id="unwiredNotice"><h2>Not connected</h2><p>Users endpoint not wired (404).</p></div>
    </section>

  </main>
