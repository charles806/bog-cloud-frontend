<div data-shell-topbar></div>
<div class="shell">
  <aside data-shell-sidebar></aside>
  <main class="main" id="main" data-shell-main>
    <div class="page__head">
      <div>
        <h1 class="page__title">Storage Analysis</h1>
        <p class="page__sub">Breakdown of stored bytes by bucket and plan.</p>
      </div>
    </div>
    <div id="alert" class="alert is-hidden" role="status" aria-live="polite"></div>

    <section class="section">
      <div class="kv" id="storageKv">
        <div class="kv__row"><div class="kv__key">Total stored</div><div class="kv__val" id="sTotal">—</div></div>
        <div class="kv__row"><div class="kv__key">Average file size</div><div class="kv__val" id="sAvg">—</div></div>

        <div class="meter-row" id="sMeter1"><div class="meter-row__head"><span>Plan usage</span><span class="meter-row__val" id="sMeterVal">—</span></div><div class="meter"><div class="meter__fill" id="sMeterFill" style="width:0%"></div></div></div>
      </div>
      <div class="empty-state is-hidden" id="unwiredNotice"><h2>Not connected</h2><p>Storage endpoint not wired (404).</p></div>
    </section>

  </main>
</div>
